name: Deploy to Pages

on:
  workflow_call:
    inputs:
      source:
        description: 'Caller workflow (evaluate/predict)'
        required: false
        type: string
        default: ''

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
      actions: read # Needed to download artifacts from other runs

    steps:
    - name: Checkout
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    # 同一runからアーティファクトをダウンロード（callerから呼ばれた場合）
    - name: Download Artifact (same run)
      uses: actions/download-artifact@v4
      with:
        path: public

    # 過去runから別のアーティファクトをダウンロード（不足分を補う）
    - name: Download Other Artifact (previous run)
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        # 現在のソースが predict なら evaluate を、evaluate なら predict を取得する
        if [ "${{ inputs.source }}" = "predict" ]; then
          TARGET_WORKFLOW="evaluate.yml"
          TARGET_ARTIFACT="evaluation-artifact"
        else
          TARGET_WORKFLOW="predict.yml"
          TARGET_ARTIFACT="prediction-artifact"
        fi
        
        echo "Searching for latest successful run of $TARGET_WORKFLOW..."
        RUN_ID=$(gh run list --workflow "$TARGET_WORKFLOW" --status success --limit 1 --json databaseId --jq '.[0].databaseId')
        
        if [ -n "$RUN_ID" ] && [ "$RUN_ID" != "null" ]; then
          echo "Found Run ID: $RUN_ID. Downloading $TARGET_ARTIFACT..."
          gh run download "$RUN_ID" --name "$TARGET_ARTIFACT" --dir "public/$TARGET_ARTIFACT" || echo "Failed to download $TARGET_ARTIFACT. Proceeding without it."
        else
          echo "No successful $TARGET_WORKFLOW runs found. Skipping."
        fi

    - name: Flatten Public Directory
      run: |
        # サブディレクトリ配下のファイルを public 直下に移動
        # (v4ではアーティファクト名ごとにディレクトリが作られるため)
        if [ -d public ]; then
          find public -mindepth 2 -type f -exec mv -v {} public/ \;
          # 空になったサブディレクトリを削除
          find public -mindepth 1 -type d -empty -delete
        fi
        ls -R public/

    - name: Generate Index
      run: |
        python deploy/index_generator.py

    - name: Setup Pages
      uses: actions/configure-pages@v4

    - name: Upload artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: 'public'
        retention-days: 1

    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4
